name: Generate X Post Drafts

on:
  schedule:
    # 毎日 日本時間 朝7:00（UTC 22:00）に定期実行
    - cron: '0 22 * * *'
  workflow_dispatch: # GitHub上のボタンから手動実行可能

jobs:
  generate-drafts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate X Drafts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SITE_BASE_URL: 'https://sneaker-checker.com'
        run: node scripts/generate-x-draft.js